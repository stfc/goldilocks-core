# Pseudopotential tables Core knows about.
#
# This declares what exists; it holds no pseudopotentials. Tables are fetched on
# first use into the user cache. Element coverage is recorded here so Core can
# say which table would resolve a gap without downloading anything first.
#
# Every field below was measured from the published tables, not read from
# documentation. Regenerate with scripts/survey_pseudo_tables.py.
#
# accuracy: "efficiency" | "precision" -- one vocabulary across libraries.
#   PseudoDojo standard -> efficiency, stringent -> precision;
#   SSSP uses these words already. The djrepo low/normal/high hints are not part
#   of this axis: Core always takes "high", so a recommended cutoff is the
#   converged one rather than the cheapest that might do.

[tables."nc-sr-04_pbesol_standard"]
provider       = "pseudodojo"
version        = "0.4"
functional     = "PBEsol"
relativistic   = "SR"
accuracy       = "efficiency"
licence        = "CC-BY-4.0"
redistribution = "upstream-only"
upstream_url   = "https://www.pseudo-dojo.org/"
citation       = "van Setten et al., Comput. Phys. Commun. 226, 39 (2018)"
transfer_bytes = 5201271
default        = true
note = """
Default table. Lanthanides beyond La and Lu need nc-sr-04-3plus_pbe_standard, which is PBE."""
elements = [
  "Ag", "Al", "Ar", "As", "Au", "B", "Ba", "Be", "Bi", "Br", "C", "Ca",
  "Cd", "Cl", "Co", "Cr", "Cs", "Cu", "F", "Fe", "Ga", "Ge", "H", "He",
  "Hf", "Hg", "I", "In", "Ir", "K", "Kr", "La", "Li", "Lu", "Mg", "Mn",
  "Mo", "N", "Na", "Nb", "Ne", "Ni", "O", "Os", "P", "Pb", "Pd", "Po",
  "Pt", "Rb", "Re", "Rh", "Rn", "Ru", "S", "Sb", "Sc", "Se", "Si", "Sn",
  "Sr", "Ta", "Tc", "Te", "Ti", "Tl", "V", "W", "Xe", "Y", "Zn", "Zr",
]

