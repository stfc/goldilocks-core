# The standalone is_magnetic classifier (v2 epic 11, #11): a small MLP head
# reading a 384-number mMACE embedding (goldilocks-ml's own
# docs/training/models/magnetism/is_magnetic-mace_mlp.md), and the mMACE
# backbone (~84 MB) it embeds structures with, which magnetic-ordering ranking
# also relaxes on (advisors/magnetic_ordering_ml.checkpoint_path; #244).
# GOLDILOCKS_MACE_BACKBONE overrides the installed backbone. goldilocks-ml
# checks the backbone against the backbone_sha256 in this record's model.json
# before loading it, so both come from the same record version (#240).
#
# No paper describes this classifier, so its citation is its PSDI record. It
# used to repeat the QRF95 k-point paper, which nothing read until bundles
# cited their models (#156).
[defaults.is_magnetic]
name = "is-magnetic-goldilocks-mace-mlp"
version = "1"
model_type = "mlp"
target = "is_magnetic"
feature_set = "mace_probe.v1"
licence = "CC-BY-4.0; see the pinned model card"
citation = "Goldilocks mMACE + MLP magnetism classifier (an MLP on mMACE mmace-matpes-pbe-pretrained embeddings, trained on MatPES PBE), PSDI Data Collections record sgk1t-48m42, https://data-collections.psdi.ac.uk/records/sgk1t-48m42."

