name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  UV_NO_PROGRESS: "1"

jobs:
  quality-and-test:
    name: Quality, tests, and mutations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install frozen dependencies
        run: uv sync --group dev --all-extras

      - name: Verify committed Workbench OpenAPI
        run: |
          uv run python scripts/export_workbench_openapi.py --output web/openapi.json
          git diff --exit-code -- web/openapi.json

      - name: Ruff check
        run: uv run ruff check src tests scripts

      - name: Ruff format check
        run: uv run ruff format --check src tests scripts

      - name: Pytest with branch coverage
        run: >-
          uv run pytest --cov --cov-report=term-missing:skip-covered
          --cov-report=xml

      - name: Mutation testing
        run: |
          uv run mutmut run --max-children 4
          uv run mutmut export-cicd-stats
          uv run python scripts/check_mutation_score.py \
            mutants/mutmut-cicd-stats.json --minimum 0.74 \
            | tee -a "$GITHUB_STEP_SUMMARY"

  workbench:
    name: Workbench types, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frozen Workbench dependencies
        working-directory: web
        run: npm ci

      - name: Verify generated TypeScript API
        working-directory: web
        run: |
          npm run generate:schema
          git diff --exit-code -- src/api/schema.d.ts

      - name: Lint, test, and build Workbench
        working-directory: web
        run: npm run check

      - name: Check production image definition
        run: docker build --check .

      - name: Build production Workbench image
        run: docker build --tag goldilocks-workbench:e2e .

      - name: Install Chromium
        working-directory: web
        run: npx --no-install playwright install --with-deps chromium

      - name: Exercise real-server browser workflow
        working-directory: web
        run: |
          docker run --detach --name goldilocks-workbench-e2e \
            --publish 8000:8000 goldilocks-workbench:e2e
          trap 'docker rm --force goldilocks-workbench-e2e' EXIT
          for attempt in {1..120}; do
            curl --fail --silent http://127.0.0.1:8000/ready && break
            sleep 1
          done
          curl --fail http://127.0.0.1:8000/ready
          npm run test:e2e

  package-build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Build source and wheel distributions
        run: uv build --no-sources

      - name: Verify distribution contents
        run: python scripts/validate_distribution.py dist
