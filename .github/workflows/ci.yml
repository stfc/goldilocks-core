name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  UV_NO_PROGRESS: "1"

jobs:
  quality-and-test:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install frozen dependencies
        run: uv sync --group dev --all-extras

      # Known gap: this clones and rebuilds enumlib from source on every CI run,
      # with no retry around the network calls and no cache keyed on the pinned
      # ref. Worth hardening the same way src/goldilocks_core/assets/download.py
      # retries/backs off PSDI downloads, but that needs real CI validation this
      # pass didn't do -- flagging for a future pass rather than guessing at it.
      - name: Build enumlib (external dependency for AFM species-splitting)
        run: |
          sudo apt-get update
          sudo apt-get install --yes gfortran
          git clone --recursive --depth 1 https://github.com/msg-byu/enumlib.git /tmp/enumlib
          make -C /tmp/enumlib/symlib/src F90=gfortran
          make -C /tmp/enumlib/src F90=gfortran
          make -C /tmp/enumlib/src F90=gfortran enum.x
          install -d /tmp/enumlib-bin
          install /tmp/enumlib/src/enum.x /tmp/enumlib-bin/enum.x
          sed "1s|.*|#!${{ github.workspace }}/.venv/bin/python3|" \
            /tmp/enumlib/aux_src/makeStr.py > /tmp/enumlib-bin/makeStr.py
          chmod +x /tmp/enumlib-bin/makeStr.py
          echo "/tmp/enumlib-bin" >> "$GITHUB_PATH"

      - name: Ruff check
        run: uv run ruff check src tests scripts

      - name: Ruff format check
        run: uv run ruff format --check src tests scripts

      - name: Import and cyclomatic complexity ceilings
        run: uv run python scripts/check_complexity.py

      - name: Pytest with branch coverage
        run: >-
          uv run pytest --cov --cov-report=term-missing:skip-covered
          --cov-report=xml

  mutation-testing:
    name: Mutation testing (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Confirmed 2026-09-25 (stfc/goldilocks-core#231): pyproject.toml's own
    # only_mutate is already a curated 5-file list, not the whole tree, but
    # those 5 files alone generate 894 mutants (measured directly via
    # mutmut's own mutant-generation code, not estimated) -- a real run
    # reached only 774/894 in a 45-minute job. Sharded across 2 jobs by
    # measured mutant count (scf.py alone is 476/894, roughly half) instead
    # of raising the timeout further, since the data showed that wouldn't
    # reliably help either. scripts/restrict_mutation_scope.py narrows each
    # shard's checkout to its own files before mutmut runs.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [scf, rest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install frozen dependencies
        run: uv sync --group dev --all-extras

      - name: Build enumlib (external dependency for AFM species-splitting)
        run: |
          sudo apt-get update
          sudo apt-get install --yes gfortran
          git clone --recursive --depth 1 https://github.com/msg-byu/enumlib.git /tmp/enumlib
          make -C /tmp/enumlib/symlib/src F90=gfortran
          make -C /tmp/enumlib/src F90=gfortran
          make -C /tmp/enumlib/src F90=gfortran enum.x
          install -d /tmp/enumlib-bin
          install /tmp/enumlib/src/enum.x /tmp/enumlib-bin/enum.x
          sed "1s|.*|#!${{ github.workspace }}/.venv/bin/python3|" \
            /tmp/enumlib/aux_src/makeStr.py > /tmp/enumlib-bin/makeStr.py
          chmod +x /tmp/enumlib-bin/makeStr.py
          echo "/tmp/enumlib-bin" >> "$GITHUB_PATH"

      - name: Restrict mutation scope to this shard
        run: uv run python scripts/restrict_mutation_scope.py ${{ matrix.shard }}

      - name: Mutation testing
        run: |
          # --max-children 2: commit aabcefd lowered this from 4 to fix a mutmut
          # internal PID-tracking race (KeyError in read_one_child_exit_status)
          # that was crashing runs on 2-core ubuntu-latest runners. Do not raise
          # this back up without confirming the race is actually fixed upstream.
          uv run mutmut run --max-children 2
          uv run mutmut export-cicd-stats

      - name: Upload shard stats
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutmut-stats-${{ matrix.shard }}
          path: mutants/mutmut-cicd-stats.json

  mutation-score:
    name: Mutation score gate
    runs-on: ubuntu-latest
    needs: mutation-testing
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download shard stats
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutmut-stats-*
          path: shard-stats

      - name: Merge shard stats and enforce the score gate
        run: |
          python3 scripts/merge_mutation_stats.py \
            merged-mutmut-cicd-stats.json \
            shard-stats/mutmut-stats-scf/mutmut-cicd-stats.json \
            shard-stats/mutmut-stats-rest/mutmut-cicd-stats.json
          python3 scripts/check_mutation_score.py \
            merged-mutmut-cicd-stats.json --minimum 0.74 \
            | tee -a "$GITHUB_STEP_SUMMARY"

  workbench:
    name: Workbench types, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install frozen HTTP dependencies
        run: uv sync --frozen --no-dev --extra http

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frozen Workbench dependencies
        working-directory: web
        run: npm ci

      - name: Lint, test, and build Workbench
        working-directory: web
        run: npm run check

      - name: Check production image definition
        run: docker build --check .

      - name: Build production Workbench image
        run: docker build --tag goldilocks-workbench:e2e .

      - name: Install Chromium
        working-directory: web
        run: npx --no-install playwright install --with-deps chromium

      - name: Exercise real-server browser workflow
        working-directory: web
        run: |
          docker run --detach --name goldilocks-workbench-e2e \
            --publish 8000:8000 goldilocks-workbench:e2e
          trap 'docker rm --force goldilocks-workbench-e2e' EXIT
          for attempt in {1..120}; do
            curl --fail --silent http://127.0.0.1:8000/ready && break
            sleep 1
          done
          curl --fail http://127.0.0.1:8000/ready
          npm run test:e2e

  package-build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: false

      - name: Build source and wheel distributions
        run: uv build --no-sources

      - name: Verify distribution contents
        run: python scripts/validate_distribution.py dist
