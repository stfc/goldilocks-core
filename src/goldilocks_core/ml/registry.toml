[defaults.kpoints]
name = "kpoints-goldilocks-QRF"
version = "QRF95"
model_type = "random_forest"
target = "k_distance"
feature_set = "qrf_comp_struct_soap_lattice_metal"
interval_confidence = 0.90

[defaults.kpoints.asset]
id = "models/qrf-kpoints"
version = "QRF95"

[[defaults.kpoints.asset.files]]
role = "model"
path = "QRF95.pkl"
url = "https://huggingface.co/STFC-SCD/kpoints-goldilocks-QRF/resolve/75588288f755522e47984b5a31b82824860d6943/QRF95.pkl"
checksum = "sha256:2647b976a57637cc34e4874f3b0ff3436a7c032761b774fdd9e56e69fddaffcc"
size = 185695399

[defaults.kpoints.calibration]
correction = -0.0016

[defaults.kpoints.features]
composition_featurizers = ["ElementProperty", "Stoichiometry", "ValenceOrbital"]
element_property_preset = "magpie"
impute_nan = true
structure_featurizers = ["GlobalSymmetryFeatures", "DensityFeatures"]
global_symmetry_features = ["spacegroup_num", "crystal_system_int", "is_centrosymmetric"]
density_features = ["density", "vpa", "packing fraction"]
soap_species = "X"
soap_r_cut = 10.0
soap_n_max = 8
soap_l_max = 6
soap_sigma = 1.0
soap_periodic = true
soap_sparse = false
soap_reduction = "mean"
lattice_symprec = 0.01
metallicity_graph_radius = 10.0
metallicity_max_neighbors = 12

[defaults.kpoints.metallicity]
name = "metallicity-goldilocks-CGCNN"
version = "1"
model_type = "cgcnn"
target = "metallicity"
feature_set = "cgcnn_radius_graph"
checkpoint_file = "is_metal.ckpt"
atom_init_file = "atom_init.json"

