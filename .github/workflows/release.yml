# Publishes the Workbench image and the Python distributions. Runs the shared
# quality gates first; publication is the last job. The draft-release staging
# redesign (checksums, artifact smoke tests, immutable releases) builds on this.
name: release

on:
  push:
    tags: ['v*']
  schedule:
    # Avoid minute 0 because GitHub can delay or drop scheduled workflows at
    # high-load times around the top of the hour.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      publish_nightly:
        description: 'Publish nightly tags instead of a sha-only image'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  UV_FROZEN: "1"
  UV_NO_PROGRESS: "1"

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  package:
    name: Build package
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/check_release_tag.py --tag "${{ github.ref_name }}"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Build source and wheel distributions
        run: uv build --no-sources

      - name: Verify distribution contents
        run: python scripts/validate_distribution.py dist

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*

  image:
    name: Build image (${{ matrix.platform }})
    needs: quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/stfc/goldilocks-workbench
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Prepare platform pair
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error

  publish:
    name: Publish image and package
    needs: [package, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/stfc/goldilocks-workbench
          tags: |
            type=raw,value=nightly,enable=${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_nightly == 'true') }}
            type=raw,value=nightly-{{date 'YYYY-MM-DD'}},enable=${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_nightly == 'true') }}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish_nightly != 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push merged multi-arch image
        working-directory: /tmp/digests
        shell: bash
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$TAGS")
          shopt -s nullglob
          digests=(*)

          if (( ${#tags[@]} == 0 )); then
            echo "No image tags were generated" >&2
            exit 1
          fi

          if (( ${#digests[@]} == 0 )); then
            echo "No image digests were downloaded" >&2
            exit 1
          fi

          args=()
          for tag in "${tags[@]}"; do
            args+=("-t" "$tag")
          done

          for digest in "${digests[@]}"; do
            args+=("ghcr.io/stfc/goldilocks-workbench@sha256:${digest}")
          done

          docker buildx imagetools create "${args[@]}"
        env:
          TAGS: ${{ steps.meta.outputs.json }}

      - name: Create release with distributions
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${{ github.ref_name }}" dist/* --generate-notes
          || gh release upload "${{ github.ref_name }}" dist/* --clobber
