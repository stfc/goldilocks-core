# The standalone is_metal classifier (v2 epic 11, #11) -- a different PSDI
# record from defaults.kpoints.metallicity above, on purpose: that one is
# QRF's own *embedded feature extractor* dependency (a Lightning checkpoint,
# no decision threshold of its own, never called standalone -- its own
# model.json's requires_artifacts pins exactly this record_id/file).
# ba06w-n6a68 is the complete, standalone release goldilocks-ml's own
# README lists under "CGCNN metallicity classifier": a lean inference
# weights file plus a real goldilocks_ml.inference-shaped model.json with
# a decision threshold, loadable directly via
# ``goldilocks_ml.inference.load_model``.
[defaults.is_metal]
name = "is-metal-goldilocks-CGCNN"
version = "1"
model_type = "cgcnn"
target = "is_metal"
feature_set = "crystal_graph.v1"
licence = "CC-BY-4.0; see the pinned model card"
citation = "Elena Patyukova et al., Automatic generation of input files with optimised k-point meshes for Quantum ESPRESSO self-consistent field single-point total energy calculations, Digital Discovery (2026), DOI 10.1039/D5DD00565E."

