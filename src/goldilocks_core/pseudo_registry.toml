# Pseudopotential tables Core knows about.
#
# This declares what exists; it holds no pseudopotentials. Nothing is installed
# without the user asking -- `gl download pp` installs the default, `gl list pp`
# shows every option. Coverage is recorded here so Core can say which table
# would resolve a gap before anything is downloaded.
#
# Every field was measured from the published tables, not read from
# documentation: the naming does not predict the content. Regenerate with
# scripts/survey_pseudo_tables.py.
#
# Entry keys are ours; `upstream_table` is what the provider calls it and what
# the download URL is built from.
#
# accuracy: "efficiency" | "precision" -- one vocabulary across libraries.
#   PseudoDojo standard -> efficiency, stringent -> precision; SSSP already uses
#   these words. The djrepo low/normal/high hints are not part of this axis:
#   Core always takes "high", so a recommended cutoff is the converged one
#   rather than the cheapest that might do.
#
# PseudoDojo also publishes nc-sr-05_pbe_{standard,stringent}. They are not
# registered: both ship 72 pseudopotentials but publish cutoff hints for only
# 61 of them, so 11 elements would install and then fail at generation.

[tables."pseudodojo-pbesol-efficiency"]
provider       = "pseudodojo"
upstream_table = "nc-sr-04_pbesol_standard"
version        = "0.4"
functional     = "PBEsol"
relativistic   = "SR"
accuracy       = "efficiency"
licence        = "CC-BY-4.0"
upstream_url   = "https://www.pseudo-dojo.org/"
citation       = "van Setten et al., Comput. Phys. Commun. 226, 39 (2018)"
transfer_bytes = 5201271
default        = true
note = """
The default. Covers everything except lanthanides beyond La and Lu, and all actinides."""
elements = [
  "Ag", "Al", "Ar", "As", "Au", "B", "Ba", "Be", "Bi", "Br", "C", "Ca",
  "Cd", "Cl", "Co", "Cr", "Cs", "Cu", "F", "Fe", "Ga", "Ge", "H", "He",
  "Hf", "Hg", "I", "In", "Ir", "K", "Kr", "La", "Li", "Lu", "Mg", "Mn",
  "Mo", "N", "Na", "Nb", "Ne", "Ni", "O", "Os", "P", "Pb", "Pd", "Po",
  "Pt", "Rb", "Re", "Rh", "Rn", "Ru", "S", "Sb", "Sc", "Se", "Si", "Sn",
  "Sr", "Ta", "Tc", "Te", "Ti", "Tl", "V", "W", "Xe", "Y", "Zn", "Zr",
]

