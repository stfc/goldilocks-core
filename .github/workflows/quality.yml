# Shared verification jobs. Called by ci.yml and release.yml; not triggered
# directly. Every step calls a named entry point: a `just` recipe, an npm
# script, or a script in scripts/.
name: quality

on:
  workflow_call:

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  UV_NO_PROGRESS: "1"

jobs:
  quality-and-test:
    name: Quality, tests, and mutations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install frozen dependencies
        run: uv sync --group dev --all-extras

      - name: Lint, complexity, and tests
        run: uv run just check

      - name: Mutation testing
        run: uv run just mutation

  workbench:
    name: Workbench types, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install frozen HTTP dependencies
        run: uv sync --frozen --no-dev --extra http

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frozen Workbench dependencies
        working-directory: web
        run: npm ci

      - name: Lint, test, and build Workbench
        working-directory: web
        run: npm run check

      - name: Install Chromium
        working-directory: web
        run: npx --no-install playwright install --with-deps chromium

      - name: Image end-to-end
        run: bash scripts/image_e2e.sh

  package-build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Build source and wheel distributions
        run: uv build --no-sources

      - name: Verify distribution contents
        run: python scripts/validate_distribution.py dist
