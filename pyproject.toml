[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "goldilocks-core"
version = "0.1.0"
description = "Materials machine learning tools for recommending DFT calculation inputs."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.2.25",
    "dscribe>=2.1",
    "huggingface_hub>=0.23",
    "joblib==1.5.3",
    "matminer>=0.10.1",
    "numpy>=2.4.4",
    "pandas>=2.0",
    "pymatgen>=2026.3.23",
    "scikit-learn==1.7.2",
    "sklearn-quantile==0.1.1",
    # The default k-points model (QRF + CGCNN metallicity) is a core capability,
    # so its ML stack ships in the base install (decision: stfc/goldilocks-core#32).
    # torch-geometric requires torch; on GPU hosts install the matching CUDA wheel
    # of torch first, then sync.
    "torch>=2.13.0",
    "torch-geometric>=2.5",
]

[project.optional-dependencies]
http = ["fastapi", "uvicorn"]
mcp = ["mcp"]

[project.scripts]
goldilocks = "goldilocks_core.cli.core:main"

[dependency-groups]
dev = [
    "mutmut>=3.6.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.11",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = ["--strict-markers", "-ra"]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "unit: isolated behavior with controlled collaborators",
    "integration: workflows crossing real package boundaries",
    "physics: scientific invariants checked independently of implementation",
]

[tool.coverage.run]
branch = true
source = ["goldilocks_core"]
omit = ["/tmp/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = true

[tool.mutmut]
source_paths = ["src/goldilocks_core"]
only_mutate = [
    "src/goldilocks_core/advice/convergence.py",
    "src/goldilocks_core/advice/magnetism.py",
    "src/goldilocks_core/advice/pseudo.py",
    "src/goldilocks_core/advice/smearing.py",
    "src/goldilocks_core/advice/soc.py",
    "src/goldilocks_core/advice/vdw.py",
    "src/goldilocks_core/functionals.py",
    "src/goldilocks_core/generation/registry.py",
    "src/goldilocks_core/generation/qe/scf.py",
    "src/goldilocks_core/kmesh/math.py",
    "src/goldilocks_core/selection.py",
]
mutate_only_covered_lines = false
pytest_add_cli_args = ["-q"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.package-data]
goldilocks_core = [
    "ml/registry.toml",
    "pseudo/registry.toml",
    "examples/structures/*.cif",
    "examples/structures/README.md",
]

