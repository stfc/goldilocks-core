# QRF95's own record.json (v2 epic 11, #11 follow-up, #92): the same
# record already carried a real, goldilocks_ml.inference-shaped
# model.json all along -- just never registered as one of this asset's
# files, so `ml.predict`'s `load_model()` had nothing to read and
# `k_sampling()`'s ml tier stayed permanently stubbed. Its own
# requires_artifacts pins is_metal.ckpt/atom_init.json from ptc95-vbq12,
# duplicated below (small files, same trick already used for
# defaults.is_metal's atom_init.json) so `load_model()` finds them beside
# this model.json rather than needing a separate GOLDILOCKS_ARTIFACTS
